<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Flowstate is a concept site by Daniele Marinangeli: a focus-app waitlist with a live WebGL fluid."><title>Flowstate — Deep Work in a Distracted World</title>
<link rel="stylesheet" href="../assets/fonts.css">
<script type="importmap">{ "imports": { "lenis": "../assets/vendor/lenis.js" } }</script>
<style>
:root {
  --hero-base: #04050c;
  --heading: #eef0f6;
  --body-muted: #b9becf;
  --on-media: #ffffff;
  --action-inverse: #ffffff;
  --action-inverse-fg: #2f2f33;
  --glass-fill: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.16);
  --scrim: rgba(4,5,12,0.46);
  --scrim-strong: rgba(4,5,12,0.68);
  --scrim-soft: rgba(4,5,12,0.12);
  --duration-fast: 150ms;
  --ease-entrance: cubic-bezier(0.2, 0, 0, 1);
}
* { margin: 0; box-sizing: border-box; }
html { font-size: 16px; }
@media (max-width: 1920px) { html { font-size: 0.833333vw; } }
@media (max-width: 1440px) { html { font-size: 1.111111vw; } }
@media (max-width: 1024px) { html { font-size: 1.5625vw; } }
@media (max-width: 640px)  { html { font-size: 4.444444vw; } }
a { color: inherit; text-decoration: none; }
button { background: none; border: 0; font: inherit; cursor: pointer; color: inherit; }
body { font-family: "Onest", sans-serif; background: var(--hero-base); color: var(--heading); overflow-x: hidden; }

.hero {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100lvh; width: 100vw; overflow: hidden; background: var(--hero-base);
  text-align: center; padding: 0 1.25rem;
}
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.scrim {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(115% 95% at 50% 46%, var(--scrim-strong) 0%, var(--scrim-strong) 24%, var(--scrim) 52%, var(--scrim-soft) 100%);
}

.nav { position: absolute; inset-inline: 0; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 1.25rem; }
.brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 500; font-size: 1.15rem; color: var(--on-media); letter-spacing: -0.01em; }
.brand svg { width: 1.35rem; height: 1.35rem; stroke: currentColor; }
.links {
  display: none; position: absolute; left: 50%; transform: translateX(-50%); height: 3rem; align-items: center; gap: 2.25rem;
  border-radius: 9999px; border: 1px solid var(--glass-border); background: var(--glass-fill);
  padding: 0 1.75rem; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.links a { font-size: 0.95rem; color: var(--body-muted); white-space: nowrap; transition: color var(--duration-fast) var(--ease-entrance); }
.links a:hover { color: var(--heading); }

.pill {
  display: inline-flex; align-items: center; justify-content: center; height: 2.5rem; border-radius: 9999px;
  background: var(--action-inverse); padding: 0 1.125rem; font-size: 0.85rem; font-weight: 500; color: var(--action-inverse-fg);
  box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: background var(--duration-fast) var(--ease-entrance); white-space: nowrap;
}
.pill:hover { background: rgba(255,255,255,0.85); }
.pill:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(255,255,255,.7); }

.col { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 22rem; }
.badge {
  display: inline-flex; align-items: center; border-radius: 9999px; border: 1px solid var(--glass-border); background: var(--glass-fill);
  padding: 0.4rem 0.875rem; font-size: 0.72rem; color: var(--body-muted); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
h1 { margin-top: 1.25rem; max-width: 20rem; font-size: 2rem; font-weight: 500; line-height: 1.1; letter-spacing: -0.02em; color: var(--heading); text-align: center; }
.sub { margin-top: 1rem; max-width: 20rem; font-size: 1rem; line-height: 1.5; color: var(--body-muted); }
.formwrap { margin-top: 1.75rem; display: flex; justify-content: center; width: 100%; }
form { width: 37rem; max-width: 100%; }
.bar {
  display: flex; align-items: center; height: 3.5rem; border-radius: 9999px; border: 1px solid var(--glass-border); background: var(--glass-fill);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 1px 2px rgba(0,0,0,.05); padding-left: 1.25rem; padding-right: 0.35rem;
}
.bar input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: none; color: var(--heading); font: inherit; font-size: 0.95rem; }
.bar input::placeholder { color: var(--body-muted); }
footer { position: absolute; inset-inline: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding: 1.25rem; font-size: 0.72rem; color: var(--body-muted); }

.w { display: inline-block; opacity: 0; will-change: transform, opacity; }
.rv { opacity: 0; will-change: transform, opacity; transition: opacity 700ms var(--ease-entrance), transform 700ms var(--ease-entrance); }
.rv.in { opacity: 1; transform: none !important; }

@media (min-width: 640px) {
  .hero { padding: 0 2.5rem; }
  .nav { padding: 1.75rem 2.5rem; }
  .brand { font-size: 1.375rem; }
  .brand svg { width: 1.5rem; height: 1.5rem; }
  .links { display: flex; }
  .pill { height: 2.75rem; padding: 0 1.375rem; font-size: 0.95rem; }
  .col { max-width: 40rem; }
  .badge { font-size: 0.8rem; }
  h1 { margin-top: 1.75rem; max-width: 34rem; font-size: 3.5rem; }
  .sub { margin-top: 1.25rem; max-width: 34rem; font-size: 1.1rem; }
  .formwrap { margin-top: 2.5rem; }
  .bar { height: 4rem; padding-left: 1.5rem; padding-right: 0.4rem; }
  .bar input { font-size: 1.15rem; }
  footer { padding: 1.5rem 2.5rem; font-size: 0.8rem; }
}
@media (min-width: 1024px) {
  .col { max-width: 52rem; }
  h1 { max-width: 46rem; font-size: 5rem; }
  .sub { max-width: none; font-size: 1.2rem; }
}

/* ---- Interface toggle: hide everything but the animation ---- */
.ui-toggle .i-eyeoff { display: none; }
body.ui-hidden .ui-toggle .i-eye { display: none; }
body.ui-hidden .ui-toggle .i-eyeoff { display: block; }
.hero > :not(canvas):not(.ui-toggle) { transition: opacity 0.6s ease, visibility 0s linear 0s; }
body.ui-hidden .hero > :not(canvas):not(.ui-toggle) { opacity: 0 !important; visibility: hidden; pointer-events: none !important; transition: opacity 0.6s ease, visibility 0s linear 0.6s; }
.ui-toggle:focus-visible { outline: 3px solid #f7dd47; outline-offset: 2px; }
.ui-toggle {
  position: absolute; z-index: 30; right: 1.25rem; bottom: 1.25rem; width: 3rem; height: 3rem; display: flex; align-items: center; justify-content: center;
  border-radius: 9999px; border: 1px solid var(--glass-border); background: var(--glass-fill); color: var(--body-muted);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: color 150ms var(--ease-entrance), background 150ms var(--ease-entrance);
}
.ui-toggle:hover { color: var(--heading); background: rgba(255,255,255,0.16); }
body.ui-hidden .ui-toggle { opacity: 0.55; }
body.ui-hidden .ui-toggle:hover { opacity: 1; }
@media (min-width: 640px) { .ui-toggle { right: 2.5rem; bottom: 1.5rem; } }

/* ---- Theme: blue (ultramarine field, yellow / pink / white ink) ---- */
html[data-theme="ultra"] {
  --hero-base: #1423b8;
  --heading: #ffffff;
  --body-muted: #e6e9ff;
  --glass-fill: rgba(255,255,255,0.16);
  --glass-border: rgba(255,255,255,0.34);
  --scrim: rgba(20,35,184,0);
  --scrim-strong: rgba(20,35,184,0);
  --scrim-soft: rgba(20,35,184,0);
}
body { transition: background-color 0.6s ease; }
html[data-theme="ultra"] .brand, html[data-theme="ultra"] .links a, html[data-theme="ultra"] .badge,
html[data-theme="ultra"] h1, html[data-theme="ultra"] .sub, html[data-theme="ultra"] footer { mix-blend-mode: difference; color: #fff; }
html[data-theme="ultra"] .links, html[data-theme="ultra"] .badge { backdrop-filter: none; -webkit-backdrop-filter: none; }
html[data-theme="ultra"] .bar { background: #ffffff; border-color: #ffffff; backdrop-filter: none; -webkit-backdrop-filter: none; }
html[data-theme="ultra"] .bar input { color: #0a0a0a; }
html[data-theme="ultra"] .bar input::placeholder { color: #5b5f73; }
html[data-theme="ultra"] .bar .pill { background: #1fc27a; color: #0a0a0a; }
html[data-theme="ultra"] .bar .pill:hover { background: #3fd493; }
.ui-toggle.theme-toggle { right: calc(1.25rem + 3.6rem); }
@media (min-width: 640px) { .ui-toggle.theme-toggle { right: calc(2.5rem + 3.6rem); } }
</style>
<script>
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('flowstate-theme') || 'dark'; } catch (e) {}
  var q = /[?&]theme=(ultra|dark)/.exec(location.search); if (q) t = q[1];
  if (t !== 'ultra') t = 'dark';
  document.documentElement.setAttribute('data-theme', t);
  window.__flowInitialTheme = t;
})();
</script>

<body>
<section class="hero">
  <canvas aria-hidden="true"></canvas>
  <div class="scrim" aria-hidden="true"></div>

  <header class="nav rv" data-delay="150" data-from="translateY(-0.75rem)">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M2.5 9c2.5 0 2.5 4.2 5 4.2S10 9 12 9s2.5 4.2 5 4.2S19.5 9 21.5 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M2.5 15c2.5 0 2.5 4.2 5 4.2S10 15 12 15s2.5 4.2 5 4.2S19.5 15 21.5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
      </svg>
      <span>Flowstate</span>
    </a>
    <nav class="links">
      <a href="#how-it-works">How it works?</a>
      <a href="#pricing">Pricing</a>
      <a href="#products">Products</a>
      <a href="../">Portfolio</a>
    </nav>
    <a class="pill" href="#get-started">Get Started</a>
  </header>

  <div class="col">
    <p class="badge rv" data-delay="320" data-from="translateY(1.25rem)">Concept site</p>
    <h1 data-words data-delay="480" data-stagger="85" data-dur="720" data-y="26">Deep Work in a Distracted World</h1>
    <p class="sub" data-words data-delay="1150" data-stagger="22" data-dur="600" data-y="14">Cut through the noise, reclaim your attention, and do work that truly matters.</p>
    <div class="formwrap rv" data-delay="1450" data-from="translateY(1.25rem)">
      <form id="waitlist">
        <div class="bar">
          <input type="email" required placeholder="Enter your email" aria-label="Email">
          <button class="pill" type="submit">Join Waitlist</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="rv" data-delay="1650" data-from="translateY(1.25rem)">© 2026 Flowstate — a concept by Daniele Marinangeli.</footer>

  <button class="ui-toggle theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch to the blue theme" title="Switch to the blue theme (T)">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="ui-toggle" id="uiToggle" type="button" aria-pressed="false" aria-label="Hide interface, show only the animation" title="Hide interface (H)">
    <svg class="i-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="i-eyeoff" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3 3.9M6.1 6.1C3.6 7.8 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.1-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>
  </button>
</section>
<script>
(function () {
  const btn = document.getElementById('uiToggle');
  function set(hidden) {
    document.querySelectorAll('.rv').forEach(e => { e.style.transitionDelay = '0ms'; });
    document.body.classList.toggle('ui-hidden', hidden);
    btn.setAttribute('aria-pressed', String(hidden));
    const label = hidden ? 'Show interface' : 'Hide interface, show only the animation';
    btn.setAttribute('aria-label', label);
    btn.title = (hidden ? 'Show interface' : 'Hide interface') + ' (H)';
  }
  btn.addEventListener('click', () => set(!document.body.classList.contains('ui-hidden')));
  window.addEventListener('keydown', e => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'h' || e.key === 'H') set(!document.body.classList.contains('ui-hidden'));
    if (e.key === 'Escape') set(false);
  });
})();
</script>

<script>
/* ---------- Reveals ---------- */
(function () {
  const ease = 'cubic-bezier(0.215, 0.61, 0.355, 1)'; // easeOutCubic
  document.querySelectorAll('[data-words]').forEach(el => {
    const words = el.textContent.trim().split(/\s+/);
    const y = el.dataset.y, dur = el.dataset.dur, stagger = +el.dataset.stagger, base = +el.dataset.delay;
    el.textContent = '';
    el.setAttribute('aria-label', words.join(' '));
    words.forEach((word, i) => {
      const s = document.createElement('span');
      s.className = 'w';
      s.setAttribute('aria-hidden', 'true');
      s.textContent = word;
      s.style.transform = 'translateY(' + y + 'px)';
      s.style.transition = 'opacity ' + dur + 'ms ' + ease + ', transform ' + dur + 'ms ' + ease;
      s.style.transitionDelay = (base + i * stagger) + 'ms';
      el.appendChild(s);
      if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
    });
  });
  document.querySelectorAll('.rv').forEach(el => {
    el.style.transform = el.dataset.from;
    el.style.transitionDelay = el.dataset.delay + 'ms';
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.rv').forEach(el => el.classList.add('in'));
    document.querySelectorAll('.w').forEach(el => { el.style.opacity = 1; el.style.transform = 'none'; });
  }));
  const form = document.getElementById('waitlist');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const input = form.querySelector('input');
    input.value = '';
    input.placeholder = 'Concept site: nothing is stored';
  });
})();
</script>

<script>
/* ---------- WebGL fluid simulation (Pavel Dobryakov, MIT) — bloom path removed (BLOOM is off) ---------- */
function fluidSimulation(canvas) {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    let config = {
        SIM_RESOLUTION: 200,
        DYE_RESOLUTION: 512,
        DENSITY_DISSIPATION: 0.958,
        VELOCITY_DISSIPATION: 0.96,
        PRESSURE_DISSIPATION: 0.8,
        PRESSURE_ITERATIONS: 20,
        CURL: 42,
        SPLAT_RADIUS: 0.22,
        SHADING: true,
        COLORFUL: true,
        PAUSED: false,
        BACK_COLOR: { r: 4, g: 5, b: 12 },
        THEME_BG: { r: 20, g: 35, b: 184 },
        TRANSPARENT: false
    }

    function pointerPrototype() {
        this.id = -1; this.x = 0; this.y = 0; this.dx = 0; this.dy = 0;
        this.down = false; this.moved = false; this.color = [30, 0, 300];
    }

    let themeMode = window.__flowInitialTheme === 'ultra' ? 1 : 0;
    let pointers = [];
    let splatStack = [];
    pointers.push(new pointerPrototype());

    const { gl, ext } = getWebGLContext(canvas);

    if (isMobile()) config.SHADING = false;
    if (!ext.supportLinearFiltering) config.SHADING = false;

    function getWebGLContext(canvas) {
        const params = { alpha: true, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
        let gl = canvas.getContext('webgl2', params);
        const isWebGL2 = !!gl;
        if (!isWebGL2)
            gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);

        let halfFloat;
        let supportLinearFiltering;
        if (isWebGL2) {
            gl.getExtension('EXT_color_buffer_float');
            supportLinearFiltering = gl.getExtension('OES_texture_float_linear');
        } else {
            halfFloat = gl.getExtension('OES_texture_half_float');
            supportLinearFiltering = gl.getExtension('OES_texture_half_float_linear');
        }

        gl.clearColor(0.0, 0.0, 0.0, 1.0);

        const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloat.HALF_FLOAT_OES;
        let formatRGBA, formatRG, formatR;

        if (isWebGL2) {
            formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
            formatRG = getSupportedFormat(gl, gl.RG16F, gl.RG, halfFloatTexType);
            formatR = getSupportedFormat(gl, gl.R16F, gl.RED, halfFloatTexType);
        } else {
            formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
            formatRG = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
            formatR = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
        }

        return { gl, ext: { formatRGBA, formatRG, formatR, halfFloatTexType, supportLinearFiltering } };
    }

    function getSupportedFormat(gl, internalFormat, format, type) {
        if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
            switch (internalFormat) {
                case gl.R16F: return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
                case gl.RG16F: return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
                default: return null;
            }
        }
        return { internalFormat, format }
    }

    function supportRenderTextureFormat(gl, internalFormat, format, type) {
        let texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
        let fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
        return gl.checkFramebufferStatus(gl.FRAMEBUFFER) == gl.FRAMEBUFFER_COMPLETE;
    }

    function isMobile() { return /Mobi|Android/i.test(navigator.userAgent); }

    class GLProgram {
        constructor(vertexShader, fragmentShader) {
            this.uniforms = {};
            this.program = gl.createProgram();
            gl.attachShader(this.program, vertexShader);
            gl.attachShader(this.program, fragmentShader);
            gl.linkProgram(this.program);
            if (!gl.getProgramParameter(this.program, gl.LINK_STATUS))
                throw gl.getProgramInfoLog(this.program);
            const uniformCount = gl.getProgramParameter(this.program, gl.ACTIVE_UNIFORMS);
            for (let i = 0; i < uniformCount; i++) {
                const uniformName = gl.getActiveUniform(this.program, i).name;
                this.uniforms[uniformName] = gl.getUniformLocation(this.program, uniformName);
            }
        }
        bind() { gl.useProgram(this.program); }
    }

    function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
            throw gl.getShaderInfoLog(shader);
        return shader;
    };

    const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
        precision highp float;
        attribute vec2 aPosition;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform vec2 texelSize;
        void main () {
            vUv = aPosition * 0.5 + 0.5;
            vL = vUv - vec2(texelSize.x, 0.0);
            vR = vUv + vec2(texelSize.x, 0.0);
            vT = vUv + vec2(0.0, texelSize.y);
            vB = vUv - vec2(0.0, texelSize.y);
            gl_Position = vec4(aPosition, 0.0, 1.0);
        }
    `);

    const clearShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        uniform sampler2D uTexture;
        uniform float value;
        void main () {
            gl_FragColor = value * texture2D(uTexture, vUv);
        }
    `);

    const colorShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        uniform vec4 color;
        void main () {
            gl_FragColor = color;
        }
    `);

    const displayShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        void main () {
            vec3 C = texture2D(uTexture, vUv).rgb;
            float a = max(C.r, max(C.g, C.b));
            gl_FragColor = vec4(C, a);
        }
    `);

    const displayInkShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uTexture;
        uniform vec2 texelSize;
        uniform vec3 bgColor;
        void main () {
            vec3 L = texture2D(uTexture, vL).rgb;
            vec3 R = texture2D(uTexture, vR).rgb;
            vec3 T = texture2D(uTexture, vT).rgb;
            vec3 B = texture2D(uTexture, vB).rgb;
            vec3 C = texture2D(uTexture, vUv).rgb;
            float dx = length(R) - length(L);
            float dy = length(T) - length(B);
            vec3 n = normalize(vec3(dx, dy, length(texelSize)));
            float diffuse = clamp(dot(n, vec3(0.0, 0.0, 1.0)) + 0.55, 0.88, 1.0);
            float m = max(C.r, max(C.g, C.b));
            vec3 hue = C / max(m, 0.0001);
            vec3 col = mix(bgColor, hue * diffuse, smoothstep(0.04, 0.5, m));
            gl_FragColor = vec4(col, 1.0);
        }
    `);

    const displayShadingShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uTexture;
        uniform vec2 texelSize;
        void main () {
            vec3 L = texture2D(uTexture, vL).rgb;
            vec3 R = texture2D(uTexture, vR).rgb;
            vec3 T = texture2D(uTexture, vT).rgb;
            vec3 B = texture2D(uTexture, vB).rgb;
            vec3 C = texture2D(uTexture, vUv).rgb;
            float dx = length(R) - length(L);
            float dy = length(T) - length(B);
            vec3 n = normalize(vec3(dx, dy, length(texelSize)));
            vec3 l = vec3(0.0, 0.0, 1.0);
            float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.0);
            C.rgb *= diffuse;
            float a = max(C.r, max(C.g, C.b));
            gl_FragColor = vec4(C, a);
        }
    `);

    const splatShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uTarget;
        uniform float aspectRatio;
        uniform vec3 color;
        uniform vec2 point;
        uniform float radius;
        void main () {
            vec2 p = vUv - point.xy;
            p.x *= aspectRatio;
            vec3 splat = exp(-dot(p, p) / radius) * color;
            vec3 base = texture2D(uTarget, vUv).xyz;
            gl_FragColor = vec4(base + splat, 1.0);
        }
    `);

    const advectionManualFilteringShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uVelocity;
        uniform sampler2D uSource;
        uniform vec2 texelSize;
        uniform vec2 dyeTexelSize;
        uniform float dt;
        uniform float dissipation;
        vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
            vec2 st = uv / tsize - 0.5;
            vec2 iuv = floor(st);
            vec2 fuv = fract(st);
            vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
            vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
            vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
            vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
            return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
        }
        void main () {
            vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
            gl_FragColor = dissipation * bilerp(uSource, coord, dyeTexelSize);
            gl_FragColor.a = 1.0;
        }
    `);

    const advectionShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        uniform sampler2D uVelocity;
        uniform sampler2D uSource;
        uniform vec2 texelSize;
        uniform float dt;
        uniform float dissipation;
        void main () {
            vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
            gl_FragColor = dissipation * texture2D(uSource, coord);
            gl_FragColor.a = 1.0;
        }
    `);

    const divergenceShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uVelocity;
        void main () {
            float L = texture2D(uVelocity, vL).x;
            float R = texture2D(uVelocity, vR).x;
            float T = texture2D(uVelocity, vT).y;
            float B = texture2D(uVelocity, vB).y;
            vec2 C = texture2D(uVelocity, vUv).xy;
            if (vL.x < 0.0) { L = -C.x; }
            if (vR.x > 1.0) { R = -C.x; }
            if (vT.y > 1.0) { T = -C.y; }
            if (vB.y < 0.0) { B = -C.y; }
            float div = 0.5 * (R - L + T - B);
            gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
        }
    `);

    const curlShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uVelocity;
        void main () {
            float L = texture2D(uVelocity, vL).y;
            float R = texture2D(uVelocity, vR).y;
            float T = texture2D(uVelocity, vT).x;
            float B = texture2D(uVelocity, vB).x;
            float vorticity = R - L - T + B;
            gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
        }
    `);

    const vorticityShader = compileShader(gl.FRAGMENT_SHADER, `
        precision highp float;
        precision highp sampler2D;
        varying vec2 vUv;
        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform sampler2D uVelocity;
        uniform sampler2D uCurl;
        uniform float curl;
        uniform float dt;
        void main () {
            float L = texture2D(uCurl, vL).x;
            float R = texture2D(uCurl, vR).x;
            float T = texture2D(uCurl, vT).x;
            float B = texture2D(uCurl, vB).x;
            float C = texture2D(uCurl, vUv).x;
            vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
            force /= length(force) + 0.0001;
            force *= curl * C;
            force.y *= -1.0;
            vec2 vel = texture2D(uVelocity, vUv).xy;
            gl_FragColor = vec4(vel + force * dt, 0.0, 1.0);
        }
    `);

    const pressureShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uPressure;
        uniform sampler2D uDivergence;
        vec2 boundary (vec2 uv) {
            return uv;
        }
        void main () {
            float L = texture2D(uPressure, boundary(vL)).x;
            float R = texture2D(uPressure, boundary(vR)).x;
            float T = texture2D(uPressure, boundary(vT)).x;
            float B = texture2D(uPressure, boundary(vB)).x;
            float C = texture2D(uPressure, vUv).x;
            float divergence = texture2D(uDivergence, vUv).x;
            float pressure = (L + R + B + T - divergence) * 0.25;
            gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
        }
    `);

    const gradientSubtractShader = compileShader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        precision mediump sampler2D;
        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D uPressure;
        uniform sampler2D uVelocity;
        vec2 boundary (vec2 uv) {
            return uv;
        }
        void main () {
            float L = texture2D(uPressure, boundary(vL)).x;
            float R = texture2D(uPressure, boundary(vR)).x;
            float T = texture2D(uPressure, boundary(vT)).x;
            float B = texture2D(uPressure, boundary(vB)).x;
            vec2 velocity = texture2D(uVelocity, vUv).xy;
            velocity.xy -= vec2(R - L, T - B);
            gl_FragColor = vec4(velocity, 0.0, 1.0);
        }
    `);

    const blit = (() => {
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(0);
        return (destination) => {
            gl.bindFramebuffer(gl.FRAMEBUFFER, destination);
            gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
        }
    })();

    let simWidth, simHeight, dyeWidth, dyeHeight;
    let density, velocity, divergence, curl, pressure;

    const clearProgram = new GLProgram(baseVertexShader, clearShader);
    const colorProgram = new GLProgram(baseVertexShader, colorShader);
    const displayProgram = new GLProgram(baseVertexShader, displayShader);
    const displayShadingProgram = new GLProgram(baseVertexShader, displayShadingShader);
    const displayInkProgram = new GLProgram(baseVertexShader, displayInkShader);
    const splatProgram = new GLProgram(baseVertexShader, splatShader);
    const advectionProgram = new GLProgram(baseVertexShader, ext.supportLinearFiltering ? advectionShader : advectionManualFilteringShader);
    const divergenceProgram = new GLProgram(baseVertexShader, divergenceShader);
    const curlProgram = new GLProgram(baseVertexShader, curlShader);
    const vorticityProgram = new GLProgram(baseVertexShader, vorticityShader);
    const pressureProgram = new GLProgram(baseVertexShader, pressureShader);
    const gradienSubtractProgram = new GLProgram(baseVertexShader, gradientSubtractShader);

    function initFramebuffers() {
        let simRes = getResolution(config.SIM_RESOLUTION);
        let dyeRes = getResolution(config.DYE_RESOLUTION);

        simWidth = simRes.width; simHeight = simRes.height;
        dyeWidth = dyeRes.width; dyeHeight = dyeRes.height;

        const texType = ext.halfFloatTexType;
        const rgba = ext.formatRGBA, rg = ext.formatRG, r = ext.formatR;
        const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

        if (density == null)
            density = createDoubleFBO(dyeWidth, dyeHeight, rgba.internalFormat, rgba.format, texType, filtering);
        else
            density = resizeDoubleFBO(density, dyeWidth, dyeHeight, rgba.internalFormat, rgba.format, texType, filtering);

        if (velocity == null)
            velocity = createDoubleFBO(simWidth, simHeight, rg.internalFormat, rg.format, texType, filtering);
        else
            velocity = resizeDoubleFBO(velocity, simWidth, simHeight, rg.internalFormat, rg.format, texType, filtering);

        divergence = createFBO(simWidth, simHeight, r.internalFormat, r.format, texType, gl.NEAREST);
        curl = createFBO(simWidth, simHeight, r.internalFormat, r.format, texType, gl.NEAREST);
        pressure = createDoubleFBO(simWidth, simHeight, r.internalFormat, r.format, texType, gl.NEAREST);
    }

    function createFBO(w, h, internalFormat, format, type, param) {
        gl.activeTexture(gl.TEXTURE0);
        let texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);

        let fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
        gl.viewport(0, 0, w, h);
        gl.clear(gl.COLOR_BUFFER_BIT);

        return {
            texture, fbo, width: w, height: h,
            attach(id) {
                gl.activeTexture(gl.TEXTURE0 + id);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                return id;
            }
        };
    }

    function createDoubleFBO(w, h, internalFormat, format, type, param) {
        let fbo1 = createFBO(w, h, internalFormat, format, type, param);
        let fbo2 = createFBO(w, h, internalFormat, format, type, param);
        return {
            get read() { return fbo1; },
            set read(value) { fbo1 = value; },
            get write() { return fbo2; },
            set write(value) { fbo2 = value; },
            swap() { let temp = fbo1; fbo1 = fbo2; fbo2 = temp; }
        }
    }

    function resizeFBO(target, w, h, internalFormat, format, type, param) {
        let newFBO = createFBO(w, h, internalFormat, format, type, param);
        clearProgram.bind();
        gl.uniform1i(clearProgram.uniforms.uTexture, target.attach(0));
        gl.uniform1f(clearProgram.uniforms.value, 1);
        blit(newFBO.fbo);
        return newFBO;
    }

    function resizeDoubleFBO(target, w, h, internalFormat, format, type, param) {
        target.read = resizeFBO(target.read, w, h, internalFormat, format, type, param);
        target.write = createFBO(w, h, internalFormat, format, type, param);
        return target;
    }

    initFramebuffers();
    // Strong entrance: dense burst plus rapid follow-up waves (drained one per frame).
    multipleSplats(34);
    for (let i = 0; i < 8; i++)
        splatStack.push(10 + parseInt(Math.random() * 10));

    let lastColorChangeTime = Date.now();
    let virtualSeeded = false;
    let orbitAngle = 0;
    let vPrevX = 0, vPrevY = 0;
    let virtualColor = null;
    let lastVColorTime = 0;
    const engineStart = Date.now();
    const ORBIT_RADIUS = 300;
    const ORBIT_SPEED = 0.026;
    const ORBIT_START_DELAY = 700;

    let rafHandle = 0;
    let destroyed = false;

    update();

    function update() {
        if (destroyed) return;
        resizeCanvas();
        driveVirtualPointer();
        input();
        if (!config.PAUSED) step(0.016);
        render(null);
        rafHandle = requestAnimationFrame(update);
    }

    // Invisible auto-cursor orbiting the centre forever.
    function driveVirtualPointer() {
        if (Date.now() - engineStart < ORBIT_START_DELAY) return;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const base = Math.min(ORBIT_RADIUS, canvas.width * 0.35, canvas.height * 0.35);
        const r = base * (0.72 + 0.28 * Math.sin(orbitAngle * 0.37));
        orbitAngle += ORBIT_SPEED;
        const x = cx + Math.cos(orbitAngle) * r;
        const y = cy + Math.sin(orbitAngle) * r;
        if (!virtualSeeded) {
            virtualSeeded = true;
            vPrevX = x; vPrevY = y;
            return;
        }
        if (!virtualColor || Date.now() - lastVColorTime > 120) {
            virtualColor = generateColor();
            const vk = themeMode === 1 ? 1.6 : 3.2; virtualColor.r *= vk; virtualColor.g *= vk; virtualColor.b *= vk;
            lastVColorTime = Date.now();
        }
        const dx = (x - vPrevX) * 9.0;
        const dy = (y - vPrevY) * 9.0;
        vPrevX = x; vPrevY = y;
        splat(x, y, dx, dy, virtualColor);
    }

    function input() {
        if (splatStack.length > 0) multipleSplats(splatStack.pop());

        for (let i = 0; i < pointers.length; i++) {
            const p = pointers[i];
            if (p.moved) {
                splat(p.x, p.y, p.dx, p.dy, p.color);
                p.moved = false;
            }
        }

        if (!config.COLORFUL) return;

        if (lastColorChangeTime + 100 < Date.now()) {
            lastColorChangeTime = Date.now();
            for (let i = 0; i < pointers.length; i++) pointers[i].color = generateColor();
        }
    }

    function step(dt) {
        gl.disable(gl.BLEND);
        gl.viewport(0, 0, simWidth, simHeight);

        curlProgram.bind();
        gl.uniform2f(curlProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
        blit(curl.fbo);

        vorticityProgram.bind();
        gl.uniform2f(vorticityProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
        gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
        gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
        gl.uniform1f(vorticityProgram.uniforms.dt, dt);
        blit(velocity.write.fbo);
        velocity.swap();

        divergenceProgram.bind();
        gl.uniform2f(divergenceProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
        blit(divergence.fbo);

        clearProgram.bind();
        gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
        gl.uniform1f(clearProgram.uniforms.value, config.PRESSURE_DISSIPATION);
        blit(pressure.write.fbo);
        pressure.swap();

        pressureProgram.bind();
        gl.uniform2f(pressureProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
        for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
            gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
            blit(pressure.write.fbo);
            pressure.swap();
        }

        gradienSubtractProgram.bind();
        gl.uniform2f(gradienSubtractProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        gl.uniform1i(gradienSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
        gl.uniform1i(gradienSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
        blit(velocity.write.fbo);
        velocity.swap();

        advectionProgram.bind();
        gl.uniform2f(advectionProgram.uniforms.texelSize, 1.0 / simWidth, 1.0 / simHeight);
        if (!ext.supportLinearFiltering)
            gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, 1.0 / simWidth, 1.0 / simHeight);
        let velocityId = velocity.read.attach(0);
        gl.uniform1i(advectionProgram.uniforms.uVelocity, velocityId);
        gl.uniform1i(advectionProgram.uniforms.uSource, velocityId);
        gl.uniform1f(advectionProgram.uniforms.dt, dt);
        gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
        blit(velocity.write.fbo);
        velocity.swap();

        gl.viewport(0, 0, dyeWidth, dyeHeight);

        if (!ext.supportLinearFiltering)
            gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, 1.0 / dyeWidth, 1.0 / dyeHeight);
        gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
        gl.uniform1i(advectionProgram.uniforms.uSource, density.read.attach(1));
        gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
        blit(density.write.fbo);
        density.swap();
    }

    function render(target) {
        if (themeMode === 1) {
            gl.disable(gl.BLEND);
            const w = target == null ? gl.drawingBufferWidth : dyeWidth;
            const h = target == null ? gl.drawingBufferHeight : dyeHeight;
            gl.viewport(0, 0, w, h);
            displayInkProgram.bind();
            const tb = config.THEME_BG;
            gl.uniform3f(displayInkProgram.uniforms.bgColor, tb.r / 255, tb.g / 255, tb.b / 255);
            gl.uniform2f(displayInkProgram.uniforms.texelSize, 1.0 / w, 1.0 / h);
            gl.uniform1i(displayInkProgram.uniforms.uTexture, density.read.attach(0));
            blit(target);
            return;
        }
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.enable(gl.BLEND);

        let width = target == null ? gl.drawingBufferWidth : dyeWidth;
        let height = target == null ? gl.drawingBufferHeight : dyeHeight;
        gl.viewport(0, 0, width, height);

        colorProgram.bind();
        let bc = config.BACK_COLOR;
        gl.uniform4f(colorProgram.uniforms.color, bc.r / 255, bc.g / 255, bc.b / 255, 1);
        blit(target);

        if (config.SHADING) {
            displayShadingProgram.bind();
            gl.uniform2f(displayShadingProgram.uniforms.texelSize, 1.0 / width, 1.0 / height);
            gl.uniform1i(displayShadingProgram.uniforms.uTexture, density.read.attach(0));
        } else {
            displayProgram.bind();
            gl.uniform1i(displayProgram.uniforms.uTexture, density.read.attach(0));
        }
        blit(target);
    }

    function splat(x, y, dx, dy, color) {
        gl.viewport(0, 0, simWidth, simHeight);
        splatProgram.bind();
        gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
        gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
        gl.uniform2f(splatProgram.uniforms.point, x / canvas.width, 1.0 - y / canvas.height);
        gl.uniform3f(splatProgram.uniforms.color, dx, -dy, 1.0);
        gl.uniform1f(splatProgram.uniforms.radius, config.SPLAT_RADIUS / 100.0);
        blit(velocity.write.fbo);
        velocity.swap();

        gl.viewport(0, 0, dyeWidth, dyeHeight);
        gl.uniform1i(splatProgram.uniforms.uTarget, density.read.attach(0));
        gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);
        blit(density.write.fbo);
        density.swap();
    }

    function multipleSplats(amount) {
        for (let i = 0; i < amount; i++) {
            const color = generateColor();
            const k = themeMode === 1 ? 2.2 : 10.0; color.r *= k; color.g *= k; color.b *= k;
            const x = canvas.width * Math.random();
            const y = canvas.height * Math.random();
            const dx = 1000 * (Math.random() - 0.5);
            const dy = 1000 * (Math.random() - 0.5);
            splat(x, y, dx, dy, color);
        }
    }

    function resizeCanvas() {
        if (canvas.width != canvas.clientWidth || canvas.height != canvas.clientHeight) {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            initFramebuffers();
        }
    }

    function pointerPos(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    const teardown = [];
    function on(target, type, handler, opts) {
        target.addEventListener(type, handler, opts);
        teardown.push(() => target.removeEventListener(type, handler, opts));
    }

    on(window, 'mousemove', e => {
        const { x, y } = pointerPos(e.clientX, e.clientY);
        const p = pointers[0];
        if (!p.everMoved) {
            p.everMoved = true;
            p.x = x; p.y = y; p.down = true;
            return;
        }
        p.down = true;
        p.moved = true;
        p.dx = (x - p.x) * 5.0;
        p.dy = (y - p.y) * 5.0;
        p.x = x; p.y = y;
        p.color = generateColor();
    });

    on(window, 'touchmove', e => {
        const touches = e.targetTouches;
        for (let i = 0; i < touches.length; i++) {
            if (i >= pointers.length) pointers.push(new pointerPrototype());
            const p = pointers[i];
            const { x, y } = pointerPos(touches[i].clientX, touches[i].clientY);
            p.down = true;
            p.moved = p.everMoved === true;
            p.everMoved = true;
            p.dx = (x - p.x) * 8.0;
            p.dy = (y - p.y) * 8.0;
            p.x = x; p.y = y;
        }
    }, { passive: true });

    on(window, 'touchstart', e => {
        const touches = e.targetTouches;
        for (let i = 0; i < touches.length; i++) {
            if (i >= pointers.length) pointers.push(new pointerPrototype());
            const p = pointers[i];
            const { x, y } = pointerPos(touches[i].clientX, touches[i].clientY);
            p.id = touches[i].identifier;
            p.down = true;
            p.x = x; p.y = y;
            p.color = generateColor();
        }
    }, { passive: true });

    on(window, 'mouseup', () => { pointers[0].down = false; });

    on(window, 'touchend', e => {
        const touches = e.changedTouches;
        for (let i = 0; i < touches.length; i++)
            for (let j = 0; j < pointers.length; j++)
                if (touches[i].identifier == pointers[j].id) pointers[j].down = false;
    });

    // lets the page switch palette at runtime; a fresh burst repaints the field
    window.__flowTheme = (mode) => { themeMode = mode; multipleSplats(26); };

    return function destroy() {
        destroyed = true;
        if (rafHandle) cancelAnimationFrame(rafHandle);
        for (const off of teardown) off();
    };

    function generateColor() {
        if (themeMode === 1) {
            // Blue theme: yellow, pink and white ink on the ultramarine field
            const inks = [[0.97, 0.87, 0.28], [0.91, 0.28, 0.62], [1.0, 1.0, 1.0]];
            const c = inks[Math.floor(Math.random() * inks.length)];
            const k = 0.5 + Math.random() * 0.5;
            return { r: c[0] * k, g: c[1] * k, b: c[2] * k };
        }
        // Electric cyan→blue→violet→magenta band
        const h = 0.5 + Math.random() * 0.42;
        let c = HSVtoRGB(h, 0.95, 1.0);
        c.r *= 0.92; c.g *= 0.92; c.b *= 0.92;
        return c;
    }

    function HSVtoRGB(h, s, v) {
        let r, g, b, i, f, p, q, t;
        i = Math.floor(h * 6);
        f = h * 6 - i;
        p = v * (1 - s);
        q = v * (1 - f * s);
        t = v * (1 - (1 - f) * s);
        switch (i % 6) {
            case 0: r = v, g = t, b = p; break;
            case 1: r = q, g = v, b = p; break;
            case 2: r = p, g = v, b = t; break;
            case 3: r = p, g = q, b = v; break;
            case 4: r = t, g = p, b = v; break;
            case 5: r = v, g = p, b = q; break;
        }
        return { r, g, b };
    }

    function getResolution(resolution) {
        let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
        if (aspectRatio < 1) aspectRatio = 1.0 / aspectRatio;
        let max = Math.round(resolution * aspectRatio);
        let min = Math.round(resolution);
        if (gl.drawingBufferWidth > gl.drawingBufferHeight)
            return { width: max, height: min };
        else
            return { width: min, height: max };
    }
}

const canvas = document.querySelector("canvas");
if (canvas) {
    try { fluidSimulation(canvas); } catch (err) { console.error("Fluid simulation failed:", err); }
}
</script>

<script type="module">
/* Lenis smooth scroll (loaded dynamically so a CDN failure never breaks the page) */
try {
  const { default: Lenis } = await import("lenis");
  const lenis = new Lenis({ smoothWheel: true });
  function raf(t) { lenis.raf(t); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
} catch (e) { console.warn("Lenis unavailable:", e); }
</script>
<script>
(function () {
  const b = document.getElementById('themeToggle');
  function apply(theme, fromUser) {
    document.documentElement.setAttribute('data-theme', theme);
    const blue = theme === 'ultra';
    b.setAttribute('aria-pressed', String(blue));
    const label = blue ? 'Switch to the dark theme' : 'Switch to the blue theme';
    b.setAttribute('aria-label', label);
    b.title = label + ' (T)';
    try { localStorage.setItem('flowstate-theme', theme); } catch (e) {}
    if (fromUser && window.__flowTheme) window.__flowTheme(blue ? 1 : 0);
  }
  const flip = () => apply(document.documentElement.getAttribute('data-theme') === 'ultra' ? 'dark' : 'ultra', true);
  apply(document.documentElement.getAttribute('data-theme'), false);
  b.addEventListener('click', flip);
  window.addEventListener('keydown', e => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 't' || e.key === 'T') flip();
  });
})();
</script>
