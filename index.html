<style>
:root {
  --bg: #e2e2e2;
  --surface: #d3d3d3;
  --ink: #7d0c14;
  --muted: #6e3b3f;
  --field: #7d0c14;
  --field-ink: #e2e2e2;
  --field-muted: #e6c4c7;
  --margin: clamp(16px, 2.2vw, 32px);
  --gap: clamp(96px, 12vw, 200px);
  --step-small: clamp(0.9375rem, 0.9rem + 0.1vw, 1rem);
  --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
  --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
  --step-head: clamp(2.75rem, 1.2rem + 6.2vw, 7rem);
  --d2: clamp(2rem, 1rem + 3.6vw, 4.125rem);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
html[data-lens="pm"] {
  --bg: #7d0c14;
  --surface: #690911;
  --ink: #e2e2e2;
  --muted: #e6c4c7;
  --field: #e2e2e2;
  --field-ink: #7d0c14;
  --field-muted: #6e3b3f;
}
* { margin: 0; box-sizing: border-box; }
html { background: var(--bg); transition: background-color 0.7s var(--ease); scroll-behavior: smooth; }
body { font-family: "Public Sans", system-ui, sans-serif; font-size: var(--step-body); line-height: 1.5; color: var(--ink); background: var(--bg); transition: background-color 0.7s var(--ease), color 0.7s var(--ease); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 0; background: none; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
.display { font-family: "Big Shoulders", "Arial Narrow", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: -0.005em; line-height: 0.88; }
p { max-width: 62ch; }

/* ---- bar ---- */
.bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px var(--margin); background: var(--bg); transition: background-color 0.7s var(--ease); }
.wordmark { font-size: var(--step-lead); text-decoration: none; }
.mini { display: flex; gap: 6px; }
.mini button, .langs button { padding: 8px 14px; font-weight: 600; font-size: var(--step-small); background: var(--surface); transition: background-color 0.3s, color 0.3s; }
.mini button[aria-pressed="true"], .langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.langs { display: flex; gap: 6px; }

/* ---- hero ---- */
.hero { padding: clamp(24px, 4vw, 56px) var(--margin) var(--gap); }
.name { display: block; }
.name .ln { display: block; width: max-content; overflow: hidden; white-space: nowrap; padding-bottom: 0.06em; margin-bottom: -0.06em; }
.name .ln > span { display: block; transform: translateY(105%); animation: rise 1.15s var(--ease) forwards; }
.name .ln:nth-child(2) > span { animation-delay: 0.12s; }
@keyframes rise { to { transform: none; } }
.hero { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: var(--margin); row-gap: clamp(20px, 3vw, 44px); align-items: start; }
.portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.7s var(--ease); }
.portrait .p-pm { opacity: 0; }
[data-lens="pm"] .portrait .p-pm { opacity: 1; }
[data-lens="pm"] .portrait .p-dev { opacity: 0; }
.hero-grid { display: contents; }
.hero .name { grid-column: 1 / span 8; grid-row: 1; }
.hero-left { grid-column: 1 / span 8; grid-row: 2; }
.role { font-size: var(--d2); margin-bottom: 18px; }
.lede { font-size: var(--step-lead); line-height: 1.35; max-width: 34ch; margin-bottom: 28px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs button { padding: 18px 26px; font-weight: 600; font-size: var(--step-body); background: var(--surface); transition: background-color 0.3s, color 0.3s, transform 0.2s var(--ease); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tabs button:hover { transform: translateY(-2px); }
.portrait { position: relative; overflow: hidden; grid-column: 9 / span 4; grid-row: 1 / span 2; align-self: start; aspect-ratio: 1 / 1; background: var(--surface); color: var(--ink); display: block; width: 100%; transition: background-color 0.7s var(--ease); }

/* ---- sections ---- */
section { padding: 0 var(--margin) var(--gap); }
.field { background: var(--field); color: var(--field-ink); padding-top: var(--gap); transition: background-color 0.7s var(--ease), color 0.7s var(--ease); }
h2 { font-size: var(--step-head); margin-bottom: clamp(32px, 4vw, 64px); max-width: 14ch; }

.figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--margin); }
.figure b { display: block; font-family: "Big Shoulders", sans-serif; font-weight: 800; font-size: clamp(88px, 15vw, 260px); line-height: 0.85; letter-spacing: -0.01em; }
.figure span { display: block; margin-top: 14px; max-width: 24ch; font-size: var(--step-lead); line-height: 1.3; }

.rows { display: grid; }
.row { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--margin); padding: clamp(20px, 2.4vw, 36px) 0; background: transparent; transition: background-color 0.25s, color 0.25s, padding 0.35s var(--ease); align-items: baseline; }
.rows .row:nth-child(odd) { background: var(--surface); margin: 0 calc(var(--margin) * -1); padding-left: var(--margin); padding-right: var(--margin); }
.row h3 { grid-column: 1 / span 5; font-size: var(--d2); font-weight: 800; }
.row p { grid-column: 7 / span 6; font-size: var(--step-lead); line-height: 1.35; }
.row .when { grid-column: 1 / span 3; font-size: var(--d2); }
.row .what { grid-column: 4 / span 9; }
.row .what strong { display: block; font-size: var(--step-lead); font-weight: 600; margin-bottom: 4px; }
.field .rows .row:nth-child(odd) { background: transparent; margin: 0; padding-left: 0; padding-right: 0; }
.field .rows .row { border: 0; }
.field .rows .row + .row { margin-top: 8px; }
.field .rows .row:nth-child(even) { background: color-mix(in srgb, var(--field-ink) 10%, transparent); margin: 0 calc(var(--margin) * -1); padding-left: var(--margin); padding-right: var(--margin); }
.field .muted { color: var(--field-muted); }

.sites { display: grid; gap: 40px; }
.site { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--margin); align-items: center; }
.card { grid-column: 1 / span 5; aspect-ratio: 16 / 10; display: block; overflow: hidden; background: var(--surface); color: var(--ink); padding: 0; text-decoration: none; font-weight: 600; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s var(--ease); }
.card:hover img { transform: scale(1.04); }
.card.flow { background: #04050c; }
.card.soon { background: var(--surface); color: var(--ink); }
.card.ombra { background: #0c0b0a; color: #c9a45c; }
.card.osteria { background: #f7f5f4; color: #2b2622; }
.card.valdemar { background: #0b0d14; color: #e4decf; }
.site .text { grid-column: 7 / span 6; }
.site h3 { font-size: var(--d2); margin-bottom: 14px; }
.site p { margin-bottom: 24px; }
.btn { display: inline-flex; align-items: center; height: 56px; padding: 0 30px; background: var(--ink); color: var(--bg); font-weight: 600; text-decoration: none; transition: transform 0.2s var(--ease); }
.btn:hover { transform: translateY(-2px); }
.badge { display: inline-flex; align-items: center; height: 56px; padding: 0 30px; background: var(--surface); font-weight: 600; }

.close { padding: var(--gap) var(--margin) var(--margin); }
.close .name { margin-bottom: 20px; }
.close small { font-size: var(--step-small); }

/* ---- reveals ---- */
.js .rv { opacity: 0; transform: translateY(26px); transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); transition-delay: var(--d, 0ms); }
.js .rv.in { opacity: 1; transform: none; }
.swap { transition: opacity 0.18s; opacity: 0 !important; }

@media (max-width: 900px) {
  .hero .name, .hero-left, .portrait { grid-column: 1 / -1; grid-row: auto; }
  .portrait { max-width: 360px; }
  .mini { display: none; }
  .row h3, .row p, .row .when, .row .what { grid-column: 1 / -1; }
  .card, .site .text { grid-column: 1 / -1; }
  h2 { max-width: none; }
}
@media (max-width: 600px) {
  .figures { grid-template-columns: 1fr; gap: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .name .ln > span { animation: none; transform: none; }
  .js .rv { opacity: 1; transform: none; transition: none; }
  * { transition-duration: 0.01ms !important; }
}
</style>

  $('figures-list').innerHTML = t.figures[lens].map(f => `<div class="figure rv"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('');
  $('what-h').textContent = t.whatH[lens];
  $('what-list').innerHTML = t.what[lens].map(r => `<div class="row rv"><h3 class="display">${r[0]}</h3><p>${r[1]}</p></div>`).join('');
  $('path-h').textContent = t.pathH[lens];
  $('path-list').innerHTML = t.path[lens].map(r => `<div class="row rv"><div class="when display">${r[0]}</div><div class="what"><strong>${r[1]}</strong><span class="muted">${r[2]}</span>${r[3] ? '<p style="margin-top:8px">' + r[3] + '</p>' : ''}</div></div>`).join('');
  $('work-h').textContent = t.workH;
  $('work-lede').textContent = t.workLede;
  $('sites').innerHTML = t.sites.map(s => `<div class="site rv">${s.href ? '<a href="' + s.href + '" class="card ' + s.cls + '" aria-label="' + s.name + '"><img src="assets/previews/' + s.img + '.webp" alt="" width="1100" height="688" loading="lazy" decoding="async"></a>' : '<div class="card ' + s.cls + '">' + s.card + '</div>'}<div class="text"><h3 class="display">${s.name}</h3><p>${s.desc}</p>${s.href ? '<a class="btn" href="' + s.href + '">' + s.cta + '</a>' : '<span class="badge">' + s.soon + '</span>'}</div></div>`).join('');
  observe();
}

function swapRender() {
  if (reduce) { render(); return; }
  const parts = document.querySelectorAll('.swap-t, .figures, .rows');
  parts.forEach(p => p.classList.add('swap'));
  setTimeout(() => { render(); parts.forEach(p => p.classList.remove('swap')); }, 190);
}

function setLens(l, push) {
  if (l === lens) return;
  lens = l; store('lens', l);
  if (push) history.replaceState(null, '', '#' + l);
  swapRender();
}
function setLang(l) {
  if (l === lang) return;
  lang = l; store('lang', l);
  swapRender();
}

let io;
function observe() {
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { threshold: 0.12 });
  document.querySelectorAll('.rv').forEach((el, i) => { el.style.setProperty('--d', (i % 5) * 70 + 'ms'); io.observe(el); });
}

function fit(el) {
  el.style.fontSize = '100px';
  const width = el.clientWidth;
  let max = 0;
  el.querySelectorAll('.ln').forEach(l => { max = Math.max(max, l.scrollWidth); });
  if (max && width) el.style.fontSize = (100 * width / max) + 'px';
}
function fitAll() { document.querySelectorAll('.fit').forEach(fit); }

document.addEventListener('click', e => {
  const lb = e.target.closest('[data-set-lens]');
  if (lb) setLens(lb.dataset.setLens, true);
  const gb = e.target.closest('[data-set-lang]');
  if (gb) setLang(gb.dataset.setLang);
});

(function init() {
  const hash = location.hash.replace('#', '');
  lens = (hash === 'pm' || hash === 'dev') ? hash : (load('lens') === 'pm' ? 'pm' : 'dev');
  const saved = load('lang');
  lang = (saved === 'it' || saved === 'en') ? saved : ((navigator.language || 'it').toLowerCase().startsWith('it') ? 'it' : 'en');
  render();
  fitAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  window.addEventListener('resize', fitAll);
  window.addEventListener('hashchange', () => {
    const h = location.hash.replace('#', '');
    if (h === 'pm' || h === 'dev') setLens(h, false);
  });
  // the closing name animates in when it arrives
  const fn = $('name2');
  const nio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { fn.classList.add('anim'); nio.disconnect(); } }), { threshold: 0.3 });
  nio.observe(fn);
})();
</script>
<style>
.close .name .ln > span { animation: none; transform: translateY(105%); transition: transform 1.1s var(--ease); }
.close .name.anim .ln > span { transform: none; }
.close .name.anim .ln:nth-child(2) > span { transition-delay: 0.12s; }
@media (prefers-reduced-motion: reduce) { .close .name .ln > span { transform: none; } }
</style>
</body>
